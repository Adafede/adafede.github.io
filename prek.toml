# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "check-added-large-files" }, { id = "check-ast" }, { id = "check-builtin-literals" }, { id = "check-case-conflict" }, { id = "check-docstring-first" }, { id = "check-executables-have-shebangs" }, { id = "check-illegal-windows-names" }, { id = "check-merge-conflict" }, { id = "check-symlinks" }, { id = "check-shebang-scripts-are-executable" }, { id = "check-toml" }, { id = "check-xml" }, { id = "check-yaml" }, { id = "debug-statements" }, { id = "end-of-file-fixer" }, { id = "mixed-line-ending" }, { id = "trailing-whitespace" }]

[[repos]]
repo = "https://github.com/fpgmaas/deptry"
rev = "0.25.1"
hooks = [{ id = "deptry", language = "python", additional_dependencies = ["deptry"], exclude = '^(?!.*\.py$).*$' }]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.38.2"
hooks = [{ id = "check-github-workflows" }, { id = "check-taskfile" }]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.22.0"
hooks = [{ id = "pyupgrade" }]

[[repos]]
repo = "https://github.com/asottile/add-trailing-comma"
rev = "v4.0.0"
hooks = [{ id = "add-trailing-comma" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.1"
hooks = [{ id = "ruff-check", args = ["--fix"] }, { id = "ruff-format" }]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.1"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.8.8"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos" }]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
hooks = [{ id = "shellcheck" }]

[[repos]]
repo = "local"
hooks = [
  { id = "ty-check", name = "ty-check", language = "python", entry = "ty check", exclude = '^(?!.*\.py$).*$', additional_dependencies = ["ty"] },
  # Fails when AGENTS.md names an npm script, a uv tool, a node file or a repo
  # path that does not exist. This is what keeps the instruction file from
  # rotting: it was already stale four ways before this existed.
  { id = "check-agent-docs", name = "check-agent-docs", language = "system", entry = "node scripts/site/check-agent-docs.mjs AGENTS.md", pass_filenames = false, files = '^(AGENTS\.md|package\.json|pyproject\.toml|scripts/site/check-agent-docs\.mjs)$' },
  # Blocks absolute home-directory paths (`/Users/…`, `C:\Users\…`, `/home/…`) from
  # being committed. They leak the local username, break on every other
  # machine, and mean a shell command was pasted rather than written.
  { id = "check-no-local-paths", name = "check-no-local-paths", language = "system", entry = "node scripts/site/check-no-local-paths.mjs", pass_filenames = false, always_run = true },
  # The knowledge graph answers navigation questions, so a stale one gives
  # confidently wrong answers. Rebuilding is ~3s and needs no model access:
  # `npm run graph:update`. Exits zero when there is no graph at all, so this
  # costs nothing on a machine that has not built one.
  { id = "check-graph-age", name = "check-graph-age", language = "system", entry = "node scripts/site/check-graph-age.mjs --strict", pass_filenames = false, files = '^(?!.*/?(graphify-out|node_modules|\.git|public|_site|_eleventy_site|src/content)/?$).*$' },
  # The endpoints under .well-known/ and the llm*.txt files are published as
  # site content, for whatever reads them. Nothing else checks that the URLs
  # they advertise still exist.
  { id = "check-agent-endpoints", name = "check-agent-endpoints", language = "system", entry = "node scripts/site/check-agent-endpoints.mjs --if-built", pass_filenames = false, files = '^(\.well-known/.*|llm.*\.txt)$' },
]

[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.24.0"

[[repos.hooks]]
id = "vale"
name = "vale sync"
pass_filenames = false
args = ["sync"]

[[repos.hooks]]
id = "vale"
args = ["--output=line", "--minAlertLevel=error"]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.31.1"
# Scoped to .github, not `.`: zizmor honours .gitignore, but only for paths it
# is not handed explicitly, and `--fix=all` will happily rewrite third-party
# workflow files under node_modules/ when the clone has them.
hooks = [{ id = "zizmor", entry = "zizmor --fix=all .github" }]

# Panache formats Quarto/Pandoc site content. AGENTS.md is engineering
# documentation, not site content: reformatting it turns the em-dash list
# separators into "---", and the linter reads code like `argv[2]` as an
# undefined cross-reference label. Excluded here rather than in .panache.toml
# because panache's own config schema moved between the pinned hook (v3.16) and
# the locally installed binary, so prek's exclude regex is the stable layer.
# Vale excludes it the same way, via its own .vale.ini section.
[[repos]]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v3.17.0"
hooks = [
  { id = "panache-format", exclude = '^AGENTS\.md$' },
  { id = "panache-lint", exclude = '^AGENTS\.md$' },
]

[[repos]]
repo = "https://github.com/adafede/pre-commit-uv-pep723-upgrade"
rev = "v0.0.1"
hooks = [{ id = "uv-pep723-upgrade" }]
