[project]
name = "adafede-github-io"
version = "0.0.1"
description = "My personal website"
requires-python = "==3.13.*"
dependencies = [
  "Pillow>=10.0.0",
  "bs4>=0.0.2",
  "circlify>=0.15.1",
  "cmcrameri>=1.10",
  "commonmeta-py>=0.309",
  "folium>=0.20.0",
  "geopy>=2.5.0",
  "ipython>=9.17.1",
  "lxml>=6.1.3",
  "markdown>=3.11.1",
  "matplotlib>=3.11.2",
  "pyyaml>=6.0.3",
  "quarto>=0.1.0",
  "ruamel-yaml>=0.19.1",
]

[dependency-groups]
dev = [
  "prek>=0.5.5",
  "pytest>=9.1.1",
]

[tool.deptry]
known_first_party = [
  "config",
  "infrastructure",
  "scripts",
  "services",
  "utilities",
]

[tool.deptry.package_module_name_map]
Pillow = [
  "PIL",
]
commonmeta-py = [
  "commonmeta",
]
ipython = [
  "IPython",
]
pyyaml = [
  "yaml",
]
PyYAML = [
  "yaml",
]
ruamel-yaml = [
  "ruamel",
  "ruamel.yaml",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["quarto", "circlify", "cmcrameri"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
# Pin the formatter/linter target to 3.13. With `requires-python = "==3.14.*"`
# ruff infers a future target whose formatter collapses `except (A, B):` into
# the invalid Python 2 `except A, B:` form (SyntaxError under 3.13+), which then
# fails the py_compile/check-ast gates. An explicit 3.13 target keeps the
# parenthesised tuple form and makes `ruff format` a no-op on these files.
target-version = "py313"

[tool.ty.rules]
unresolved-import = "ignore"
