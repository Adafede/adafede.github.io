    name:
      given: Adriano
      family: Rutz
      literal: Adriano Rutz
    orcid: 0000-0003-0443-9902
    qid: Q97455964
    url: https://adafede.github.io

execute:
  freeze: auto

filters:
  - filters/expand-prefixes.lua

format:
  html:
    anchor-sections: true
    # axe:
    # best-practice: true
    # standard: wcag21aa
    grid:
      body-width: 1200px
    # include-in-header:
