    linkcolor: "#3377c4"
    link-external-icon: false
    link-external-newwindow: true
    theme:
      - none
    respect-user-color-scheme: true
    smooth-scroll: true

kernel: .venv

project:
  type: website
  resources:
    - robots.txt
    - _headers
    - humans.txt
    - llm.txt
    - llms.txt
    - llms-full.txt
    - site.webmanifest
    - .well-known
  post-render:
    - scripts/postrender.py
  pre-render:
    - scripts/prerender.py

website:
  title: Adriano Rutz
  description: Personal website of Adriano Rutz - Swiss Pharmaceutical Scientist specializing in metabolomics, mass spectrometry, and natural products research.
  site-path: ./
  site-url: https://adafede.github.io
  favicon: images/favicon/favicon.svg
  repo-url: https://github.com/adafede/adafede.github.io
  search:
    location: navbar
  open-graph:
    locale: en
    site-name: Adriano Rutz
  navbar:
