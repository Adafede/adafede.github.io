Packages = AsciiDoc, alex, Google, Joblint, Microsoft, neighbor, proselint, Readability, RedHat, write-good

StylesPath = .github/vale/styles

Vocab = adafede.github.io

[*.{adoc,md,mdx,rst,txt}]
BasedOnStyles = Vale, Google, Microsoft, write-good, proselint, Joblint, alex, Readability, AsciiDoc, RedHat

# The agent docs are engineering documentation, not published prose. They are
# dense in code identifiers (migrate_posts, Nunjucks, jsonFeed, graphify,
# deptry, prek) that the spelling rules flag as misspellings, and they use em
# dashes as list separators, which the Google/Microsoft dash rules forbid.
# Style-checking them produces hundreds of false positives and no signal, so
# they are excluded. Vale matches on the path it is handed, so the symlinked
# names need to be listed as well as AGENTS.md itself.
[AGENTS.md]
BasedOnStyles =

[CLAUDE.md]
BasedOnStyles =

[GEMINI.md]
BasedOnStyles =

[AGENT_AUDIT.md]
BasedOnStyles =
