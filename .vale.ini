Packages = AsciiDoc, alex, Google, Joblint, Microsoft, neighbor, proselint, Readability, RedHat, write-good

StylesPath = .github/vale/styles

Vocab = adafede.github.io

[*.{adoc,md,mdx,rst,txt}]
BasedOnStyles = Vale, Google, Microsoft, write-good, proselint, Joblint, alex, Readability, AsciiDoc, RedHat

# AGENTS.md is engineering documentation, not published prose. It is
# dense in code identifiers (migrate_posts, Nunjucks, jsonFeed, graphify,
# deptry, prek) that the spelling rules flag as misspellings, and it uses em
# dashes as list separators, which the Google/Microsoft dash rules forbid.
# Style-checking it produces ~40 false positives and no signal.
[AGENTS.md]
BasedOnStyles =
