name: Publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch: null

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: read
  discussions: read
  packages: write
  pages: write
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  publish:
    runs-on: codeberg-medium
    container:
      image: ghcr.io/mcanouil/quarto-codespaces:latest
    concurrency:
      group: altdoc-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TEXINPUTS: "_texlocal:"
    permissions:
      contents: read
      id-token: write
      pages: write

    steps:
      # Checkout repository
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Cache Apt packages to avoid downloading TeX Live on every run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-apt-
          lookup-only: true

       # Install system dependencies and TeX Live
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm \
            libqpdf-dev \
            libxslt1-dev
          wget https://mirror.ctan.org/systems/texlive/tlnet/update-tlmgr-latest.sh
          sudo sh update-tlmgr-latest.sh --accept
          sudo tlmgr option repository http://mirror.ctan.org/systems/texlive/tlnet
          sudo tlmgr update --self
          sudo tlmgr install \
          caption \
          fancyhdr \
          ifmtarg \
          koma-script \
          moresize \
          multirow \
          pgf \
          wrapfig \
          xifthen
          sudo mktexlsr

      # Cache R packages
      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/R
          key: ${{ runner.os }}-r

      # Install R dependencies
      - name: Install R dependencies
        run: |
          Rscript -e "install.packages('pak', repos='https://r-lib.github.io/p/pak/stable/')"
          Rscript -e "pak::pkg_install(c('rmarkdown','knitr'))"
      # Build the site
      - name: Build site
        run: uv run quarto render
      # Deploy to Codeberg Pages
      - name: Deploy to Codeberg Pages
        if: github.event_name != 'pull_request'
        uses: actions/git-pages@v2
        with:
          site: https://adafede.codeberg.page/
          token: ${{ forge.token }}
          source: _site/
