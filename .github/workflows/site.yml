name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          package-manager-cache: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d

      - run: uv sync --all-extras

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

      - run: npm ci

      - run: node --test tests/

      - run: npm run build:all

      - run: npm run check:contrast

      - run: npm run check:links

      - name: Install Chromium for pa11y
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
          echo "CHROMIUM_PATH=$(which chromium || which chromium-browser)" >> "$GITHUB_ENV"

      - run: |
          npx --yes @11ty/eleventy --serve --port=8080 &
          npx --yes wait-on http://localhost:8080/index.html --timeout=60000
          PUPPETEER_EXECUTABLE_PATH="${CHROMIUM_PATH}" npx --yes pa11y-ci@4 --config .pa11yci.json

      - run: npm run check:rdfa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eleventy-site
          path: _eleventy_site
          retention-days: 14
