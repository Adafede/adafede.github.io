name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e

      - run: uv sync

      - run: bun install --frozen-lockfile

      # Cheapest gate in the pipeline, and the one that protects every other
      # step: if AGENTS.md tells an agent to run something that no longer
      # exists, nothing downstream can fix that.
      - run: bun run check:agent-docs

      # Nothing machine-local may be committed: absolute home paths leak the
      # local username and break everywhere else.
      - run: bun run check:local-paths

      # Lint, format, types, typos and prose style. Until this ran here, the
      # whole set was enforced only by the local pre-commit hook, so an agent
      # working on a cloud runner or pushing through the GitHub/Codeberg web
      # UI got no style gate at all. Same hooks, same config, same results as
      # `bun run lint` locally.
      - name: Lint and style
        run: bun run lint

      # Cheap, and they catch what the build cannot: these assert properties of
      # the helpers (citation rendering, CSL formatting, path rebasing, sitemap
      # coverage) that a successful build says nothing about.
      - run: uv run pytest -q

      - run: node --test tests/

      - run: bun run build:all

      - run: bun run check:contrast

      - run: bun run check:links

      - run: bun run check:document

      - name: Install Chromium for pa11y
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
          echo "CHROMIUM_PATH=$(which chromium || which chromium-browser)" >> "$GITHUB_ENV"

      - run: |
          bunx @11ty/eleventy --serve --port=8080 &
          bunx wait-on http://localhost:8080/index.html --timeout=60000
          PUPPETEER_EXECUTABLE_PATH="${CHROMIUM_PATH}" bunx pa11y-ci@4 --config .pa11yci.json

      - run: bun run check:rdfa

      # Last, because it needs a built site: the endpoints under .well-known/
      # and the llm*.txt files are published for other people's agents, and a
      # rename upstream silently breaks them.
      - run: bun run check:agent-endpoints

      # No upload-artifact step on purpose. The built site was being uploaded
      # here on every push *and* pull request (~4 MB compressed, 14-day
      # retention) and nothing ever downloaded it: the Pages deploy in
      # publish.yml uploads its own copy via upload-pages-artifact. Dropping
      # the duplicate removes the artifact from every run without changing
      # what ships.
