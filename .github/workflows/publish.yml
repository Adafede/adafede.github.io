name: Publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch: null

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: read
  discussions: read
  packages: write
  pages: write
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TEXINPUTS: "_texlocal:"
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkout repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Install System Dependencies & Complete TeX Live packages via APT
      - name: Install system dependencies and TeX packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm \
            libqpdf-dev \
            libxslt1-dev \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-pictures \
            texlive-science \
            texlive-luatex

      # Setup Node.js (needed by setup-r; on GH Actions ubuntu-latest Node is pre-installed)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      # Setup UV with native caching
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: false

      # Setup R & R dependencies (handles R package caching automatically)
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown

      # Setup Pandoc
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e

      # Setup Quarto using system TeX Live (tinytex: false)
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          tinytex: false

      # Install Python deps for the content migration (sync:content)
      - run: uv sync --all-extras

      - name: Install bs4 (BeautifulSoup4) for PDF rendering
        run: uv pip install beautifulsoup4

      - run: npm ci

      # `npm run build:all` is the single canonical build command for this
      # project and produces `_eleventy_site/` locally and in deploy
      # (see README). It runs, in order: render-pdfs (Quarto PDFs — skipped
      # without a toolchain), sync:content, build:eleventy. PDFs come only
      # from Quarto (LaTeX-quality, with the CiTO filters); the HTML site is
      # Eleventy-only, so Quarto is never the website renderer.

      # Ensure .nojekyll is present so GitHub Pages serves all files
      # (including files/directories with underscores in their names)
      - name: Add .nojekyll
        run: |
          touch _eleventy_site/.nojekyll
          echo "# This file prevents GitHub Pages from running Jekyll.\n# The site is built with Eleventy (HTML) and Quarto (PDFs); static files\n# are deployed from _eleventy_site/.\n# For custom HTTP response headers (cache-control, CSP, etc.),\n# this site is best deployed via Netlify which supports the _headers file.\n# On GitHub Pages, static assets receive a default max-age=600 cache." > _eleventy_site/.nojekyll

      # Upload artifact for Pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.event_name != 'pull_request'
        with:
          path: _eleventy_site/

      # Deploy to GitHub Pages
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        if: github.event_name != 'pull_request'
