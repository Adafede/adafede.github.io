name: Publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch: null

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: read
  discussions: read
  packages: write
  pages: write
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TEXINPUTS: "_texlocal:"
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkout repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Install System Dependencies & Complete TeX Live packages via APT
      - name: Install system dependencies and TeX packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm \
            libqpdf-dev \
            libxslt1-dev \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-pictures \
            texlive-science \
            texlive-luatex

      # Setup UV with native caching
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: false

      # Setup R & R dependencies (handles R package caching automatically)
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown

      # Setup Pandoc
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e

      # Setup Quarto using system TeX Live (tinytex: false)
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          tinytex: false

      # Build the site
      - name: Build site
        run: uv run quarto render

      # Upload artifact for Pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.event_name != 'pull_request'
        with:
          path: _site/

      # Deploy to GitHub Pages
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        if: github.event_name != 'pull_request'
